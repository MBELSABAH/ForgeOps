name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ForgeOps.slnx
      - name: Build
        run: dotnet build ForgeOps.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ForgeOps.slnx -c Release --no-build --no-restore
